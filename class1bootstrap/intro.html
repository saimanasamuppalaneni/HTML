<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"

href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<style>

        background-color: beige;

        border: 3px solid ;

        background-color: wheat;

</style>

<body>
    <h1>My Hobby Card</h1>

        <div class="row">

                    <h3>Drawing</h3>
                    <p>I love sketching animals and comic characters.</p>

                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Football</h3>
                    <p>I i play football every evening with my friends.</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Reading</h3>
                    <p>my favourite books are adventure books.</p>
                </div>
            </div>


        
        </div>
    </div>

</script>
