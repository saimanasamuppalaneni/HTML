<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color:lightsalmon;
            color: darkslategray;
            font-family: Arial, Helvetica, sans-serif;
        }

        .hero-name {
            font-size: 40px;
            font-weight: bold;
            color: darkblue;
            text-shadow: 3px 3px beige;
        }

        .tagline {
            font-style: italic;
            color: blue;
            text-transform: capitalize;
        }

        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: black;

        }

        .power {
            font-weight: bold;
            color: navy;
        }

        .weekness {
            text-decoration: line-through;
            color: navy;
        
        }

        .badge {
            font-size: 28px;
            font-weight: bold;
            color: darkorchid;
            transform: rotate(15deg);
        }

        .made-by {
            color: black;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">The most powerful hero in the school</p>

    <h2 class="label">Super Powers</h2>
    <p class="power">can run faster that a cheetah</p>
    <p class="power">can lift a school  bus</p>

    <h2 class="label">weekness</h2>
    <P class="weekness">maths homework</P>
    <P class="weekness">broccoli</P>

    <p class="badge">Top Heros</p>

    <P class="made by">created by Manasa</P>
    
</body>
</html>
