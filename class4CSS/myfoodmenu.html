<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color:grey;
            padding: 30px;
            text-align: center;
        }

        h1 + p{
            background-color: wheat;
            padding: 10px 20px;
            border-radius: 8px;
            color:black;
            display:inline-block
        }

        ul > li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: beige;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background-color: darkgoldenrod;
            border-radius: 8px;
        }

        ul li:nth-child(3){
            background-color: darkorange;

        }

        .desc {
            color:whitesmoke;
            margin-top: 20px;
            font-size: 15px;

        }

        .desc::first-letter{
            font-size: 220%;
            color: aqua;
            font-weight: bold;

        }

        a {
            color: black;
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding:8px 18px;
            border:2px solid ;
            border-radius: 8px;
        }

        a:hover {
            background-color: antiquewhite;
            color: black;
        }
    </style>
</head>
<body>
    <h1>My Food Menu</h1>
    <p>Pick you favourite dish and dig in!</p>
    <ul>
        <li>Pizza</li>
        <li>burger</li>
        <li>Tacos-Chef's special!</li>
        <li>noodles</li>
        <li>Ice cream</li>
    </ul>

    <p class="desc">Every dish on this menu is made with love and loads of flavour. try them all and find your favourite!</p>
    <div class="links">
    <a href="#">Order Now</a>
    <a href="#">See More</a>  
    </div>
</body>
</html>
