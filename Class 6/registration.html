<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form>
        <label for="name">Name</label>
        <input type="text" name="name"><br><br>
        <lable for="contact">Contact No</lable>
        <input type="password" name="contact">
        <br><br>  
        <lable for="email">Email</lable>
        <input type="email" name="email">
        <br><br>
        <lable for="gender">Gender</lable><br><br>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female<br><br>
        <lable for="city">Favourite City</lable><br><br>
        <input type="checkbox" name="city">Delhi
        <input type="checkbox" name="city">Mumbai
        <br><br>
        <input type="submit">
</form>
</body>
</html>
