<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: bisque;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            
        }

        .fact-file {
            background-color:white;
            color: black;
            width: 260px;
            padding:25px;
            border: 4px solid rgb(164, 115, 24);
            margin: 30px;
        }

        .animal-name {
            color: darkcyan;
            font-size: 22px;
        }

        .detail {
            color: black;
        }

        .cool-fact {
            color:chocolate;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: big cat</p>
        <p class="detail">Lives in:Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Deer,Goats and wild sheep</p>
        <p class="cool-fact">Cool Fact: can leap up to 15 metersin one jump!</p>
    </div>
    
</body>
</html>
