<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: antiquewhite;
            padding: 65px 30px 30px 30px;
            min-height: 1800px;
        }

        h1{color: darkolivegreen;}

        .top-bar {
            position:fixed;
            top: 0;
            left:0;
            right:0;
            background-color: darkkhaki;
            color: black;
            padding: 14px 20px;

        }

        .list-item {
            background-color:burlywood;
            border: 2px solid ;
            padding: 10px 20px;
            margin: 5px 0;

        }

        .special-note {
            position:relative;
            left:30px;
            background-color: goldenrod;
            padding: 10px 20px;
            margin: 10px ;
        }

        .pet-card {
            position:relative;
            background-color: rgb(224, 168, 93);
            border: 3px solid;
            padding:15px 20px;

            }

        .badge { 
            position:absolute;
            top: 8px;
            right: 8px;
            background-color: aquamarine;
            padding: 4px 8px;
        }

        .section-label {
            position:sticky;
            top: 55px;
            background-color: cadetblue;
            padding: 10px 20px;
            margin: 15px 0 8px;
        }
    </style>
</head>
<body>
    <div class="top-bar">My Pet Page-Buddy the Labrador</div>
    <h1>Meet Buddy!</h1>

    <div class="list-item">Breed: Labrador</div>
    <div class="list-item">Age:2 years old</div>

    <div class="special-note">Pet of the Month!</div>

    <div class="pet-card">
        <p>Buddy-Labrador,2 years</p>
        <div class="badge">Adopted!</div>

    </div>

    <div class="section-label">More pets Available</div>
    <div class="list-item">Luna - Poodle , 1 year</div>
    <div class="list-item">Max - German Shephered , 3 years</div>
    <div class="list-item">Daisy - Beagle , 4 years</div>
    
</body>
</html>
